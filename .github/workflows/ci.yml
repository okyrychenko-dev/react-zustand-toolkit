name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-compatibility:
    name: React ${{ matrix.react }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - react: 18.0.0
            react-dom: 18.0.0
          - react: 19.2.0
            react-dom: 19.2.0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install React compatibility target
        run: pnpm add --save-dev --save-exact --lockfile=false react@${{ matrix.react }} react-dom@${{ matrix.react-dom }}

      - name: Verify published Store behavior
        run: >-
          pnpm exec vitest run
          src/core/__tests__/createShallowStore.test.ts
          src/core/__tests__/createStoreToolkit.test.tsx
          src/core/__tests__/createStoreToolkit.ssr.test.tsx
          src/hooks/storeSelection/__tests__/createStoreSelectionBindings.test.ts
          src/providers/__tests__/createStoreProvider.test.tsx

  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Verify packed package
        if: matrix.node == 22
        run: pnpm run package:check

      - name: Upload coverage
        if: matrix.node == 22
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
